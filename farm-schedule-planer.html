<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作付けプラン簡易入出力ツール</title>
<style>
:root{--text:#2C2C2B;--muted:#7D7A75;--line:#E6E5E3;--soft:#F9F8F7;--green:#46A171;--green2:#E8F1EC;--orange:#D5803B;--orange2:#FBEBDE;--blue:#2783DE;--blue2:#E5F2FC;--red:#E56458;--red2:#FCE9E7;--purple:#8E6AD8;--purple2:#F0EAFB}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Meiryo,sans-serif;background:#fff}.app{max-width:1240px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.eyebrow{font-size:13px;color:var(--green);font-weight:800}.title{font-size:30px;margin:2px 0 4px;font-weight:850}.lead{margin:0;color:var(--muted);font-size:14px}.settings-box{display:grid;grid-template-columns:110px 150px;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}button.primary{background:var(--green);border-color:var(--green);color:#fff}button.small{padding:7px 9px;font-size:12px}.panel{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:5px}input,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:white}.span2{grid-column:span 2}.span4{grid-column:span 4}.drop{border:2px dashed #cfd9d3;background:#fff;border-radius:12px;min-height:72px;display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer}.drop.drag{border-color:var(--green);background:var(--green2)}.drop img{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}.drop small,.hint{color:var(--muted);font-size:12px}.work-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.work-add{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:end}.work-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.work-chip{display:flex;gap:6px;align-items:center;border:1px solid #b9d9f5;background:var(--blue2);color:#1d66ad;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.work-chip button{border:0;background:transparent;color:#1d66ad;padding:0 2px}.crop-strip-wrap{margin-bottom:14px}.strip-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.dot{display:inline-block;width:12px;height:12px;border-radius:99px;margin-right:5px;vertical-align:-1px}.crop-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px}.crop-card{flex:0 0 250px;display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:white}.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--green2);border:1px solid var(--line)}.crop-name{font-weight:850;font-size:14px}.crop-variety,.mini{font-size:12px;color:var(--muted)}.delete{color:var(--red);padding:7px 9px}.schedule-wrap{border:1px solid var(--line);border-radius:14px;background:white;overflow-x:auto;overflow-y:hidden}.schedule{min-width:1680px}.months,.terms,.crop-row{display:grid;grid-template-columns:150px repeat(var(--term-count,36),1fr)}.months{position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}.terms{position:sticky;top:41px;z-index:3;border-bottom:1px solid var(--line)}.corner{background:var(--soft);border-right:1px solid var(--line);padding:10px;font-weight:850}.month{grid-column:span 3;background:var(--soft);text-align:center;font-weight:850;padding:10px 0;border-right:1px solid var(--line)}.term{text-align:center;color:var(--muted);font-size:11px;padding:6px 0;border-right:1px solid var(--line)}.crop-row{min-height:86px;border-bottom:1px solid var(--line);position:relative}.label{padding:8px;border-right:1px solid var(--line);display:block;background:white}.label img{display:block;width:100%;aspect-ratio:4/3;height:auto;margin-top:6px;border-radius:8px;object-fit:cover;background:var(--green2);border:1px solid var(--line)}.label-title{font-size:13px;font-weight:850;line-height:1.25}.label-sub{font-size:10px;color:var(--muted);line-height:1.25;margin-top:2px}.cell{border-right:1px solid #f0efed}.bar{position:absolute;height:18px;border-radius:99px;padding:0 7px;display:flex;align-items:center;font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sow{top:10px;background:var(--green2);color:#24724b;border:1px solid #b7dcc7}.work{background:var(--blue2);color:#1d66ad;border:1px solid #b9d9f5}.harvest{top:58px;background:var(--orange2);color:#9a5723;border:1px solid #efc7a8}.seed{top:78px;background:var(--purple2);color:#6840b5;border:1px solid #d6c5f2}.print-note{display:none}.print-schedule{display:none}@media(max-width:900px){.header{display:block}.settings-box,.actions{margin-top:12px}.grid{grid-template-columns:1fr 1fr}.span4{grid-column:span 2}.work-add{grid-template-columns:1fr 1fr}.work-add .field:first-child{grid-column:span 2}}@page{size:A4 landscape;margin:6mm}@media print{.app{max-width:none;padding:0}.panel,.crop-strip-wrap,.actions,.lead,.eyebrow,.title,.print-note{display:none}.print-schedule{display:none}.header{margin:0 0 4mm}.settings-box{display:block;border:0;padding:0;background:white}.settings-box .field{display:inline-block;margin-right:8mm}.settings-box{display:none}.print-meta{display:block;font-size:9pt;font-weight:700;margin:0 0 3mm}.settings-box input,.settings-box select{border:0;padding:0;font-size:9pt;appearance:none;background:white}.schedule-wrap{display:none}.print-schedule{display:block}.print-page{break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}.print-table{width:100%;min-width:0;border:0}.print-table .months,.print-table .terms,.print-table .crop-row{grid-template-columns:28mm repeat(36,1fr)}.schedule>.months,.schedule>.terms,.schedule>.crop-row{grid-template-columns:28mm repeat(var(--term-count,36),1fr)}.corner{padding:1.5mm;font-size:7pt}.month{font-size:clamp(4.5pt, calc(180pt / var(--month-count,12)), 8pt);padding:1.5mm 0;overflow:hidden;white-space:nowrap}.term{font-size:clamp(3.5pt, calc(90pt / var(--term-count,36)), 6.5pt);padding:.8mm 0;overflow:hidden;white-space:nowrap}.crop-row{break-inside:avoid}.label{padding:1.2mm;gap:0}.label img{display:block;width:100%;aspect-ratio:4/3;height:auto;margin-top:1mm;border-radius:1.5mm;object-fit:cover}.label-title{font-size:6.2pt}.label-sub{font-size:5.2pt}.bar{height:3.4mm;font-size:clamp(3.5pt, calc(120pt / var(--term-count,36)), 5.5pt);padding:0 .8mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}.sow{top:2mm}.harvest{top:10mm}.seed{top:14mm}}
</style></head><body><div class="app"><header class="header"><div><h1 class="title">作付けプラン簡易入出力ツール</h1></div><div class="settings-box"><div class="field"><label>スタート年</label><input id="yearInput" type="number" value="2026" min="2000" max="2100" onchange="updateCalendarType()"></div><div class="field"><label>カレンダー種類</label><select id="calendarType" onchange="updateCalendarType()"><option value="spring">春スタート</option><option value="autumn" selected>秋スタート</option><option value="multi">複数年</option></select></div></div><div class="actions"><button onclick="addSample()">サンプル追加</button><button onclick="clearAll()">全削除</button><button onclick="exportExcel()">Excel出力</button><button class="primary" onclick="window.print()">PDF出力</button></div></header>
<section class="panel"><div class="grid"><div class="field"><label>作物名</label><input id="name" placeholder="例：スナップえんどう"></div><div class="field"><label>品種名</label><input id="variety" placeholder="例：候補品種"></div><div class="field span2"><label>画像（ドラッグ＆ドロップ可）</label><div id="drop" class="drop"><img id="preview" src=""><div><b>画像をここへ</b><br><small>クリックして選択もできます</small></div><input id="image" type="file" accept="image/*" hidden></div></div><div class="field"><label>種まき開始</label><select id="sowStart"></select></div><div class="field"><label>種まき終了</label><select id="sowEnd"></select></div><div class="field"><label>収穫開始</label><select id="harvestStart"></select></div><div class="field"><label>収穫終了</label><select id="harvestEnd"></select></div><div class="field"><label>種採り開始</label><select id="seedStart"></select></div><div class="field"><label>種採り終了</label><select id="seedEnd"></select></div><div class="span4 work-panel"><b>作業を追加</b><div class="work-add"><div class="field"><label>作業名</label><input id="workName" placeholder="例：支柱立て、防寒、追肥"></div><div class="field"><label>作業開始</label><select id="workStart"></select></div><div class="field"><label>作業終了</label><select id="workEnd"></select></div><button type="button" onclick="addWork()">作業追加</button></div><div id="workList" class="work-list"></div></div><div class="span4"><button class="primary" onclick="addCrop()">作物を追加</button> <button onclick="resetForm()">入力をリセット</button></div></div></section>
<section class="crop-strip-wrap"><div class="strip-head"><div class="legend"><span><i class="dot" style="background:var(--green2);border:1px solid #b7dcc7"></i>種まき</span><span><i class="dot" style="background:var(--blue2);border:1px solid #b9d9f5"></i>作業</span><span><i class="dot" style="background:var(--orange2);border:1px solid #efc7a8"></i>収穫</span><span><i class="dot" style="background:var(--purple2);border:1px solid #d6c5f2"></i>種採り</span></div><span class="hint">作物カードは横スクロールできます</span></div><div id="cropList" class="crop-strip"></div></section>
<section class="schedule-wrap"><div class="schedule" id="schedule"></div></section><section id="printSchedule" class="print-schedule"></section></div>
<script>
let months=[], terms=[];let crops=[], currentImage='', draftWorks=[];const fallback='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" rx="12" fill="#E8F1EC"/><circle cx="40" cy="40" r="20" fill="#46A171" opacity=".85"/></svg>');
function makeMonths(){const type=document.getElementById('calendarType')?.value||'autumn';const y=+(document.getElementById('yearInput')?.value||2026);let startMonth= type==='autumn'?8:3;let count= type==='multi'?36:12;months=[];for(let i=0;i<count;i++){let m=((startMonth-1+i)%12)+1;let yr=y+Math.floor((startMonth-1+i)/12);months.push({label:m+'月',year:yr,month:m})}terms=months.flatMap(o=>['上旬','中旬','下旬'].map(t=>`${o.year}年 ${o.label}${t}`));}
function fillSelect(id,keep){const s=document.getElementById(id);const old=keep?s.value:null;s.innerHTML='';terms.forEach((t,i)=>{let o=document.createElement('option');o.value=i;o.textContent=t;s.appendChild(o)});if(old!==null && +old<terms.length)s.value=old;}
function init(){makeMonths();['sowStart','sowEnd','harvestStart','harvestEnd','seedStart','seedEnd','workStart','workEnd'].forEach(id=>fillSelect(id,false));sowStart.value=Math.min(6,terms.length-1);sowEnd.value=Math.min(8,terms.length-1);harvestStart.value=Math.min(21,terms.length-1);harvestEnd.value=Math.min(26,terms.length-1);seedStart.value=Math.min(27,terms.length-1);seedEnd.value=Math.min(30,terms.length-1);workStart.value=Math.min(9,terms.length-1);workEnd.value=Math.min(10,terms.length-1);setupDrop();renderWorks();render()}
function updateCalendarType(){makeMonths();['sowStart','sowEnd','harvestStart','harvestEnd','seedStart','seedEnd','workStart','workEnd'].forEach(id=>fillSelect(id,true));crops=crops.map(c=>({...c,sowStart:Math.min(c.sowStart,terms.length-1),sowEnd:Math.min(c.sowEnd,terms.length-1),harvestStart:Math.min(c.harvestStart,terms.length-1),harvestEnd:Math.min(c.harvestEnd,terms.length-1),seedStart:Math.min(c.seedStart??c.harvestEnd,terms.length-1),seedEnd:Math.min(c.seedEnd??c.harvestEnd,terms.length-1),works:c.works.map(w=>({...w,start:Math.min(w.start,terms.length-1),end:Math.min(w.end,terms.length-1)}))}));renderWorks();render()}
function metaText(){const y=document.getElementById('yearInput')?.value||'';const label={spring:'春スタート',autumn:'秋スタート',multi:'複数年'}[document.getElementById('calendarType')?.value||'autumn'];return `スタート年：${y}　カレンダー種類：${label}`}
function setupDrop(){preview.src=fallback;drop.onclick=()=>image.click();image.onchange=()=>handleFile(image.files[0]);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',ev=>handleFile(ev.dataTransfer.files[0]));}
function handleFile(file){if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{currentImage=r.result;preview.src=currentImage};r.readAsDataURL(file)}
function addWork(){const n=workName.value.trim();if(!n){alert('作業名を入力してください');return}draftWorks.push({name:n,start:+workStart.value,end:+workEnd.value});workName.value='';renderWorks()}
function removeDraftWork(i){draftWorks.splice(i,1);renderWorks()}
function renderWorks(){workList.innerHTML=draftWorks.map((w,i)=>`<span class="work-chip">${esc(w.name)}｜${terms[w.start]}〜${terms[w.end]} <button onclick="removeDraftWork(${i})">×</button></span>`).join('')||'<span class="hint">作業はまだ追加されていません。</span>'}
function addCrop(){const nameEl=document.getElementById('name');const varietyEl=document.getElementById('variety');const n=nameEl.value.trim();if(!n){alert('作物名を入力してください');return}crops.push({id:Date.now(),name:n,variety:varietyEl.value.trim(),image:currentImage,sowStart:+document.getElementById('sowStart').value,sowEnd:+document.getElementById('sowEnd').value,harvestStart:+document.getElementById('harvestStart').value,harvestEnd:+document.getElementById('harvestEnd').value,seedStart:+document.getElementById('seedStart').value,seedEnd:+document.getElementById('seedEnd').value,works:[...draftWorks]});resetForm();render()}
function resetForm(){document.getElementById('name').value='';document.getElementById('variety').value='';document.getElementById('image').value='';currentImage='';document.getElementById('preview').src=fallback;draftWorks=[];renderWorks()}
function clearAll(){if(confirm('すべて削除しますか？')){crops=[];render()}}
function removeCrop(id){crops=crops.filter(c=>c.id!==id);render()}
function addSample(){crops=[{id:1,name:'スナップえんどう',variety:'候補品種',image:'',sowStart:6,sowEnd:8,harvestStart:21,harvestEnd:27,seedStart:27,seedEnd:31,works:[{name:'支柱立て',start:9,end:10},{name:'防寒',start:12,end:17},{name:'誘引',start:18,end:21}]},{id:2,name:'菜花',variety:'固定種候補',image:'',sowStart:4,sowEnd:7,harvestStart:19,harvestEnd:23,seedStart:24,seedEnd:27,works:[{name:'間引き',start:7,end:8},{name:'追肥',start:15,end:16}]}];render()}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function bar(cls,start,end,text,top,offset=0,count=terms.length){const max=offset+count-1;start=Math.max(offset,Math.min(max,start));end=Math.max(start,Math.min(max,end));const relStart=start-offset,span=end-start+1;return `<div class="bar ${cls}" style="left:calc(var(--label-width, 150px) + ${relStart} * ((100% - var(--label-width, 150px)) / ${count}));width:calc(${span} * ((100% - var(--label-width, 150px)) / ${count}) - 6px);${top!==undefined?'top:'+top+'px':''}">${text}</div>`}
function render(){document.getElementById('schedule').style.setProperty('--term-count',terms.length);document.getElementById('schedule').style.setProperty('--month-count',months.length);document.getElementById('schedule').style.setProperty('--label-width','150px');document.getElementById('schedule').style.minWidth=(150+terms.length*42.5)+'px';cropList.innerHTML=crops.map(c=>`<div class="crop-card"><img class="thumb" src="${c.image||fallback}"><div><div class="crop-name">${esc(c.name)}</div><div class="crop-variety">${esc(c.variety||'品種未定')}</div><div class="mini">作業 ${c.works.length}件</div></div><button class="delete" onclick="removeCrop(${c.id})">削除</button></div>`).join('')||'<p class="hint">まだ作物がありません。</p>';let html='<div class="months"><div class="corner">作物</div>'+months.map(m=>`<div class="month">${(document.getElementById('calendarType')?.value==='multi'||m.month===1)?String(m.year).slice(2)+'年 ':''}${m.label}</div>`).join('')+'</div><div class="terms"><div class="corner"></div>'+months.flatMap(()=>['上','中','下']).map(t=>`<div class="term">${t}</div>`).join('')+'</div>';html+=crops.map(c=>{const hasWorks=c.works.length>0;let h=hasWorks?Math.max(142,116+c.works.length*20):104;let harvestTop=hasWorks?h-48:34;let seedTop=hasWorks?h-26:56;let workBars=c.works.map((w,i)=>bar('work',w.start,w.end,'作業：'+esc(w.name),34+i*20)).join('');return `<div class="crop-row" style="min-height:${h}px"><div class="label"><img src="${c.image||fallback}"><div><div class="label-title">${esc(c.name)}</div><div class="label-sub">${esc(c.variety||'品種未定')}</div></div></div>${Array(terms.length).fill(0).map(()=>'<div class="cell"></div>').join('')}${bar('sow',c.sowStart,c.sowEnd,'種まき')}${workBars}${bar('harvest',c.harvestStart,c.harvestEnd,'収穫',harvestTop)}${bar('seed',c.seedStart??c.harvestEnd,c.seedEnd??c.harvestEnd,'種採り',seedTop)}</div>`}).join('');schedule.innerHTML=html}

function buildPrintSchedule(){
  const root=document.getElementById('printSchedule');
  const type=document.getElementById('calendarType')?.value||'autumn';
  const chunkTerms=36; // 12か月分
  const chunks=[];
  for(let start=0; start<terms.length; start+=chunkTerms){chunks.push({start,count:Math.min(chunkTerms,terms.length-start),months:months.slice(start/3,start/3+12)});}
  root.innerHTML=chunks.map((ch,idx)=>{
    let head=`<div class="print-meta">${esc(metaText())}${chunks.length>1?'　'+(idx+1)+'/'+chunks.length:''}</div>`;
    let html=head+`<div class="print-table" style="--term-count:${ch.count};--month-count:${ch.months.length};--label-width:28mm"><div class="months"><div class="corner">作物</div>`+
      ch.months.map(m=>`<div class="month">${(type==='multi'||m.month===1)?String(m.year).slice(2)+'年 ':''}${m.label}</div>`).join('')+
      `</div><div class="terms"><div class="corner"></div>`+ch.months.flatMap(()=>['上','中','下']).map(t=>`<div class="term">${t}</div>`).join('')+`</div>`;
    html+=crops.map(c=>{
      const visibleWorks=c.works.filter(w=>w.end>=ch.start && w.start<ch.start+ch.count);
      const hasWorks=visibleWorks.length>0;let h=hasWorks?Math.max(108,96+visibleWorks.length*20):86;let harvestTop=hasWorks?h-48:34;let seedTop=hasWorks?h-26:56;
      let bits=`<div class="crop-row" style="min-height:${h}px"><div class="label"><img src="${c.image||fallback}"><div><div class="label-title">${esc(c.name)}</div><div class="label-sub">${esc(c.variety||'品種未定')}</div></div></div>`+Array(ch.count).fill(0).map(()=>'<div class="cell"></div>').join('');
      if(c.sowEnd>=ch.start && c.sowStart<ch.start+ch.count) bits+=bar('sow',c.sowStart,c.sowEnd,'種まき',undefined,ch.start,ch.count);
      visibleWorks.forEach((w,i)=>bits+=bar('work',w.start,w.end,'作業：'+esc(w.name),34+i*20,ch.start,ch.count));
      if(c.harvestEnd>=ch.start && c.harvestStart<ch.start+ch.count) bits+=bar('harvest',c.harvestStart,c.harvestEnd,'収穫',harvestTop,ch.start,ch.count);
      const ss=c.seedStart??c.harvestEnd, se=c.seedEnd??c.harvestEnd; if(se>=ch.start && ss<ch.start+ch.count) bits+=bar('seed',ss,se,'種採り',seedTop,ch.start,ch.count);
      return bits+'</div>';
    }).join('');
    return `<div class="print-page">${html}</div></div>`;
  }).join('');
}
window.addEventListener('beforeprint',buildPrintSchedule);

function exportExcel(){
  const baseHeaders=['作物名','品種名','種まき開始','種まき終了','収穫開始','収穫終了','種採り開始','種採り終了','作業一覧'];
  const yearRow=[metaText(),...Array(baseHeaders.length-1).fill(''),...months.flatMap(m=>[m.year,m.year,m.year])];
  const termRow=[...baseHeaders,...months.flatMap(()=>['上旬','中旬','下旬'])];
  let rows=[yearRow,termRow];
  crops.forEach(c=>{
    let workText=c.works.map(w=>`${w.name}(${terms[w.start]}〜${terms[w.end]})`).join(' / ');
    let line=[esc(c.name),esc(c.variety),terms[c.sowStart],terms[c.sowEnd],terms[c.harvestStart],terms[c.harvestEnd],terms[c.seedStart??c.harvestEnd],terms[c.seedEnd??c.harvestEnd],esc(workText)];
    terms.forEach((_,i)=>{
      let v=[];
      if(i>=c.sowStart&&i<=c.sowEnd)v.push('種まき');
      c.works.forEach(w=>{if(i>=w.start&&i<=w.end)v.push(w.name)});
      if(i>=c.harvestStart&&i<=c.harvestEnd)v.push('収穫');
      if(i>=(c.seedStart??c.harvestEnd)&&i<=(c.seedEnd??c.harvestEnd))v.push('種採り');
      line.push(esc(v.join('・')))
    });
    rows.push(line)
  });
